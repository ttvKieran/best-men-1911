<body>
  <div class="atmosphere" aria-hidden="true"><div class="aurora aurora-one"></div><div class="aurora aurora-two"></div><div class="aurora aurora-three"></div><div class="aurora-curtain curtain-one"></div><div class="aurora-curtain curtain-two"></div><div class="sky-ribbon ribbon-one"></div><div class="sky-ribbon ribbon-two"></div><span class="meteor meteor-one"></span><span class="meteor meteor-two"></span><span class="meteor meteor-three"></span><span class="meteor meteor-four"></span><canvas id="ambient-canvas"></canvas></div>
  <div class="shell">

  <script>
  (function(){
    var app=document.getElementById('app');
    var profile=null;
    var mode='BEST MEN OF BASE · 19.11';
    var arrow='<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    var back='<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 12H5m6 6-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
    function head(){window.scrollTo({top:0,behavior:'smooth'});var h=app.querySelector('h1');if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true});}}
    function gift(){return '<div class="gift-visual" aria-hidden="true"><img class="gift-image gift-closed-image" src="./gift-closed.png?v=two-loop" alt="" draggable="false"><img class="gift-image gift-open-image" src="./gift-open.png?v=two-loop" alt="" draggable="false"></div>';}
    var soundToggle=document.getElementById('sound-toggle');
    var AudioEngine=window.AudioContext||window.webkitAudioContext;
    var sound={context:null,master:null,timer:null,next:0,step:0,started:false,pending:false,openingQueued:false,enabled:true};
    try{sound.enabled=window.localStorage.getItem('base-1911-music')!=='off';}catch(ignore){}
    function soundControl(){
      soundToggle.classList.toggle('is-muted',!sound.started);
      soundToggle.setAttribute('aria-pressed',String(sound.enabled&&sound.started));
      var label=!AudioEngine?'Trình duyệt không hỗ trợ nhạc nền':sound.enabled&&sound.started?'Tắt nhạc nền':'Bật nhạc nền';
      soundToggle.setAttribute('aria-label',label);soundToggle.title=label;
      soundToggle.disabled=!AudioEngine;
    }
    function tone(midi,at,length,volume,bell){
      var context=sound.context;var frequency=440*Math.pow(2,(midi-69)/12);
      var voice=context.createOscillator();var envelope=context.createGain();
      voice.type=bell?'sine':'triangle';voice.frequency.setValueAtTime(frequency,at);
      envelope.gain.setValueAtTime(.0001,at);
      envelope.gain.exponentialRampToValueAtTime(volume,at+(bell?.018:.22));
      envelope.gain.exponentialRampToValueAtTime(bell?volume*.17:volume*.43,at+Math.max(bell?.36:1.1,length*.55));
      envelope.gain.exponentialRampToValueAtTime(.0001,at+length+(bell?.65:.35));
      voice.connect(envelope);envelope.connect(sound.master);voice.start(at);voice.stop(at+length+(bell?.7:.4));
      if(bell){var shimmer=context.createOscillator();var shimmerGain=context.createGain();shimmer.type='sine';shimmer.frequency.setValueAtTime(frequency*2.01,at);shimmerGain.gain.setValueAtTime(.0001,at);shimmerGain.gain.exponentialRampToValueAtTime(volume*.21,at+.012);shimmerGain.gain.exponentialRampToValueAtTime(.0001,at+.55);shimmer.connect(shimmerGain);shimmerGain.connect(sound.master);shimmer.start(at);shimmer.stop(at+.57);}
    }
    function scheduleMusic(){
      if(!sound.context||!sound.started||document.hidden)return;
      var beat=60/88;var chords=[[48,52,55,59],[45,48,52,55],[41,45,48,52],[43,47,50,55]];
      var melody=[64,67,71,67,64,67,72,67,69,72,76,72,67,71,74,71];
      while(sound.next<sound.context.currentTime+.28){
        var bar=Math.floor(sound.step/4)%4;
        if(sound.step%4===0){for(var i=0;i<4;i++)tone(chords[bar][i],sound.next,beat*3.7,.026,false);}
        tone(melody[sound.step%16],sound.next+.06,beat*.78,.072,true);
        sound.next+=beat;sound.step++;
      }
    }
    function startSound(){
      if(!AudioEngine||!sound.enabled||document.hidden||sound.started||sound.pending)return;
      sound.pending=true;
      try{
        if(!sound.context){sound.context=new AudioEngine();sound.master=sound.context.createGain();sound.master.gain.value=0;sound.master.connect(sound.context.destination);}
        Promise.resolve(sound.context.resume()).then(function(){
          sound.pending=false;if(!sound.enabled||document.hidden)return;
          sound.started=true;sound.next=sound.context.currentTime+.06;sound.step=0;
          sound.master.gain.cancelScheduledValues(sound.context.currentTime);
          sound.master.gain.setValueAtTime(0,sound.context.currentTime);
          sound.master.gain.linearRampToValueAtTime(.13,sound.context.currentTime+2);
          scheduleMusic();sound.timer=setInterval(scheduleMusic,120);soundControl();
          if(sound.openingQueued){sound.openingQueued=false;openingChime();}
        }).catch(function(){sound.pending=false;soundControl();});
      }catch(ignore){sound.pending=false;soundControl();}
    }
    function pauseSound(){
      if(sound.timer){clearInterval(sound.timer);sound.timer=null;}
      if(sound.context&&sound.master){var now=sound.context.currentTime;sound.master.gain.cancelScheduledValues(now);sound.master.gain.setTargetAtTime(0,now,.08);}
      sound.started=false;sound.openingQueued=false;soundControl();
    }
    function toggleSound(){
      if(sound.started){sound.enabled=false;pauseSound();}
      else{sound.enabled=true;startSound();}
      try{window.localStorage.setItem('base-1911-music',sound.enabled?'on':'off');}catch(ignore){}
      soundControl();
    }
    function openingChime(){
      if(!sound.enabled)return;
      if(!sound.started||!sound.context){sound.openingQueued=true;startSound();return;}
      var now=sound.context.currentTime+.02;
      tone(76,now,.9,.11,true);tone(79,now+.15,1,.10,true);tone(84,now+.31,1.3,.12,true);
    }
    soundToggle.addEventListener('click',toggleSound);
    document.addEventListener('pointerdown',function(event){if(event.pointerType==='mouse'&&!soundToggle.contains(event.target))startSound();},{passive:true});
    document.addEventListener('pointerup',function(event){if(event.pointerType!=='mouse'&&!soundToggle.contains(event.target))startSound();},{passive:true});
    document.addEventListener('click',function(event){if(!soundToggle.contains(event.target))startSound();});
    document.addEventListener('keydown',function(event){if(!soundToggle.contains(event.target)&&(event.key.length===1||event.key==='Enter'))startSound();});
    document.addEventListener('visibilitychange',function(){if(document.hidden)pauseSound();else if(sound.enabled&&sound.context)startSound();});
    soundControl();
    function initAmbient(){
      var canvas=document.getElementById('ambient-canvas');var ctx=canvas.getContext('2d');if(!ctx)return;
      var reduced=window.matchMedia('(prefers-reduced-motion: reduce)');var stars=[];var width=0;var height=0;var last=0;
      function resize(){var ratio=Math.min(window.devicePixelRatio||1,1.5);width=window.innerWidth;height=window.innerHeight;canvas.width=Math.round(width*ratio);canvas.height=Math.round(height*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);stars=Array.from({length:width<700?70:125},function(_,i){return {x:Math.random()*width,y:Math.random()*height,r:.8+Math.random()*1.7,phase:Math.random()*6.28,speed:.4+Math.random()*.9,alpha:.28+Math.random()*.48,flare:i%12===0};});draw(0);}
      function draw(time){ctx.clearRect(0,0,width,height);for(var i=0;i<stars.length;i++){var star=stars[i];var x=star.x+(reduced.matches?0:time*.002*star.speed)%width;var y=star.y-(reduced.matches?0:time*.012*star.speed)%height;if(x>width)x-=width;if(y<0)y+=height;var glow=reduced.matches?1:.7+.3*Math.sin(time*.0018*star.speed+star.phase);ctx.fillStyle='rgba(225,239,255,'+(star.alpha*glow)+')';ctx.beginPath();ctx.arc(x,y,star.r,0,Math.PI*2);ctx.fill();if(star.flare){ctx.strokeStyle='rgba(180,216,255,'+(star.alpha*.56*glow)+')';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x-6,y);ctx.lineTo(x+6,y);ctx.moveTo(x,y-6);ctx.lineTo(x,y+6);ctx.stroke();ctx.fillStyle='rgba(131,185,255,'+(star.alpha*.15*glow)+')';ctx.beginPath();ctx.arc(x,y,star.r*5,0,Math.PI*2);ctx.fill();}}}
      function tick(time){if(!document.hidden&&time-last>32){draw(time);last=time;}if(!reduced.matches)requestAnimationFrame(tick);}
      window.addEventListener('resize',resize,{passive:true});resize();if(!reduced.matches)requestAnimationFrame(tick);
    }
    function renderLanding(){profile=null;app.innerHTML='<section class="hero"><div class="hero-copy"><h1 class="display"><span>BEST MEN</span><span class="blue-word">OF BASE</span></h1><p class="subline">Hôm nay là ngày dành riêng cho anh</p><p class="intro">Một món quà nhỏ từ những lời chúc chân thành của đồng đội Base dành riêng cho anh<br>Nhập email công ty để khám phá điều đang chờ anh nhé</p><form class="lookup-form" id="lookup-form" novalidate><label class="field-label" for="email">Email Base của anh</label><div class="input-row"><input class="email-input" id="email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="ten.anh@base.vn" required aria-describedby="form-error"><button class="primary-btn" id="submit-btn" type="submit">TÌM MÓN QUÀ '+arrow+'</button></div><p class="form-note" id="form-error">'+(mode.indexOf('MINH HỌA')>=0?'Thử bản mẫu với <button class="sample-btn" id="sample-btn" type="button">demo.1911@base.vn</button>':'Chỉ sử dụng email công ty Base')+'</p></form></div><div class="hero-art" aria-hidden="true"><div class="orbit"></div><i class="orbit-spark spark-a"></i><i class="orbit-spark spark-b"></i><i class="orbit-spark spark-c"></i><span class="floating-note note-top">A LITTLE SURPRISE</span><span class="floating-note note-bottom">MADE FOR YOU · 19.11</span><span class="corner-star star-one"></span><span class="corner-star star-two"></span>'+gift()+'</div></section>';
      document.getElementById('lookup-form').addEventListener('submit',lookup);
      var sample=document.getElementById('sample-btn');if(sample)sample.addEventListener('click',function(){document.getElementById('email').value='demo.1911@base.vn';document.getElementById('email').focus();});head();}
    async function lookup(e){e.preventDefault();var input=document.getElementById('email');var error=document.getElementById('form-error');var button=document.getElementById('submit-btn');var email=input.value.trim().toLowerCase();if(!/^[a-z0-9._%+-]+@base\.vn$/.test(email)){error.textContent='Vui lòng nhập email @base.vn hợp lệ để tiếp tục';error.classList.add('error');input.focus();return;}error.textContent='Đang tìm lời chúc dành cho anh…';error.classList.remove('error');button.disabled=true;button.textContent='ĐANG TÌM…';try{var response=await fetch('https://best-men-of-base-1911-2026.insightfulolive4.chatgpt.site/api/wishes',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:email})});var data=await response.json();if(!response.ok)throw new Error(data.error||'Không thể kết nối');if(data.found){profile=data.profile;renderGift();}else{renderEmpty();}}catch(err){renderError(err.message);}finally{button.disabled=false;}}
    function renderGift(){var count=profile.wishes.length;app.innerHTML='<section class="screen gift-stage"><h1>Một món quà dành cho <strong>'+esc(profile.name)+'</strong></h1><p class="lead">'+esc(profile.team||'Base')+' · '+count+' lời chúc đang chờ anh</p><button class="gift-button" id="unwrap" type="button" aria-label="Bấm vào hộp quà để mở '+count+' lời chúc">'+gift()+'</button><div class="gift-hint"><svg viewBox="0 0 28 28" fill="none" aria-hidden="true"><path d="M14 24V5m-7 7 7-7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="hint-desktop">Bấm vào hộp quà để khám phá</span><span class="hint-mobile">Chạm vào hộp quà để khám phá</span></div><div class="screen-actions"><button class="text-btn" id="change-email">'+back+' Đổi email</button></div></section>';document.getElementById('unwrap').onclick=unwrap;document.getElementById('change-email').onclick=renderLanding;head();}
    var opening=false;
    function burstFrom(box){var rect=box.getBoundingClientRect();var x=rect.left+rect.width*.5;var y=rect.top+rect.height*.49;var colors=['#f6c783','#ffe3b4','#a8d0ff','#f8fbff','#4c91ff'];var light=document.createElement('i');light.className='burst-light';light.style.setProperty('--origin-x',x+'px');light.style.setProperty('--origin-y',y+'px');document.body.appendChild(light);setTimeout(function(){light.remove();},1500);var count=window.innerWidth<700?34:58;for(var i=0;i<count;i++){var angle=Math.random()*Math.PI*2;var distance=100+Math.random()*(window.innerWidth<700?120:230);var dx=Math.cos(angle)*distance;var dy=Math.sin(angle)*distance*.72;var bit=document.createElement('i');bit.className='burst-piece';bit.style.setProperty('--origin-x',x+'px');bit.style.setProperty('--origin-y',y+'px');bit.style.setProperty('--x',dx+'px');bit.style.setProperty('--y',dy+'px');bit.style.setProperty('--x2',(dx*1.3)+'px');bit.style.setProperty('--y2',(dy+170+Math.random()*120)+'px');bit.style.setProperty('--rotation',(Math.random()*540-270)+'deg');bit.style.setProperty('--rotation2',(Math.random()*900-450)+'deg');bit.style.setProperty('--duration',(1.25+Math.random()*.65)+'s');bit.style.setProperty('--size',(4+Math.random()*8)+'px');bit.style.setProperty('--radius',i%3?'50%':'2px');bit.style.setProperty('--color',colors[i%colors.length]);document.body.appendChild(bit);setTimeout(function(node){node.remove();},2100,bit);}}
    function launchFlyingCards(box){var rect=box.getBoundingClientRect();var x=rect.left+rect.width*.5;var y=rect.top+rect.height*.48;var isMobile=window.innerWidth<700;var offsets=isMobile?[-95,0,95]:[-190,0,190];for(var i=0;i<3;i++){var card=document.createElement('i');card.className='flying-card';card.style.setProperty('--origin-x',x+'px');card.style.setProperty('--origin-y',y+'px');card.style.setProperty('--x',(offsets[i]-39)+'px');card.style.setProperty('--y',(isMobile?-70-(i%2)*15:-130-(i%2)*38)+'px');card.style.setProperty('--x2',(offsets[i]*1.6-60)+'px');card.style.setProperty('--y2',(isMobile?-70-(i%2)*15:-185-(i%2)*20)+'px');card.style.setProperty('--turn',((i-1)*16)+'deg');card.style.setProperty('--turn2',((i-1)*27)+'deg');card.style.animationDelay=(i*75)+'ms';document.body.appendChild(card);setTimeout(function(node){node.remove();},1650,card);}}
    function unwrap(){if(opening)return;opening=true;openingChime();var box=document.getElementById('unwrap');box.classList.add('opening');document.body.classList.add('celebrating');var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;if(!reduced){burstFrom(box);setTimeout(function(){launchFlyingCards(box);},560);}setTimeout(function(){opening=false;renderWishes(true);setTimeout(function(){document.body.classList.remove('celebrating');},850);},reduced?120:2150);}
    function renderWishes(fromReveal){var count=profile.wishes.length;var cards=profile.wishes.map(function(w,i){return '<article class="wish-card"><div class="wish-card-top"><span>LỜI CHÚC '+String(i+1).padStart(2,'0')+' / '+String(count).padStart(2,'0')+'</span><span class="card-icon" aria-hidden="true"></span></div><p class="wish-text">“'+esc(w.wish)+'”</p><div class="wish-sender">'+(w.sender?'TỪ '+esc(w.sender):'MỘT LỜI NHẮN DÀNH CHO ANH')+'</div></article>';}).join('');app.innerHTML='<section class="screen wishes-screen'+(fromReveal?' reveal-arrival':'')+'"><div class="wishes-header"><div><h1>Những lời chúc <strong>dành cho anh</strong></h1><p class="lead">'+esc(profile.name)+' · '+esc(profile.team||'Base')+'</p></div><div class="count-mark">'+String(count).padStart(2,'0')+'</div></div><div class="wish-grid">'+cards+'</div><div class="wishes-actions"><button class="primary-btn" id="close-wishes">KHÉP LẠI MÓN QUÀ '+arrow+'</button><button class="text-btn" id="home-wishes">'+back+' Về trang đầu</button></div></section>';document.getElementById('close-wishes').onclick=renderClosing;document.getElementById('home-wishes').onclick=renderLanding;head();}

    function renderEmpty(){app.innerHTML='<section class="screen"><div class="empty-symbol" aria-hidden="true"><span></span></div><h1>Hôm nay vẫn là <strong>ngày của anh</strong></h1><p class="lead">Chưa tìm thấy lời chúc riêng cho email này<br>Cảm ơn anh vì những điều tích cực anh mang đến Base mỗi ngày</p><p class="lead" style="font-size:14px">Nếu email cần được cập nhật, anh có thể liên hệ HR hoặc admin khối</p><div class="screen-actions"><button class="primary-btn" id="retry">THỬ EMAIL KHÁC '+arrow+'</button></div></section>';document.getElementById('retry').onclick=renderLanding;head();}

    document.getElementById('home-brand').onclick=renderLanding;initAmbient();renderLanding();
  })();
